name: Generate Release Keystore (run once)

on:
  workflow_dispatch:
    inputs:
      key_alias:
        description: 'یک اسم برای کلید (هرچی، مثلا applimiter)'
        required: true
        default: 'applimiter'
      store_password:
        description: 'رمز کیستور (حتما جایی یادداشت کن)'
        required: true
      key_password:
        description: 'رمز کلید (میتونه همون رمز بالا باشه)'
        required: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias "${{ inputs.key_alias }}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ inputs.store_password }}" \
            -keypass "${{ inputs.key_password }}" \
            -dname "CN=AppLimiter, OU=Dev, O=AppLimiter, L=Tehran, S=Tehran, C=IR"

      - name: Base64 encode for GitHub Secrets
        run: base64 -w0 release.keystore > release.keystore.b64

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: |
            release.keystore
            release.keystore.b64
